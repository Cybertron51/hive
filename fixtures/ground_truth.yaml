# Claims the judge must rule on. Each matches by doc + entity + claim_type + numbers.
contradiction:
  - {id: judge_quillon_45m, doc: quillon_funding_news.html, entity: Quillon Shield, claim_type: funding, numbers: ["$45 million"], expected_verdict: disagree}
