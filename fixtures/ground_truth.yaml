# Machine-readable ground truth for the fixture corpus. Human-readable version: fixtures/README.md.
# All vendors are fictional.
#
# Matching (hive/eval/score.py):
#   entity     canonical name; a claim matches if its entity resolves to this name, or if its entity is
#              not a tracked vendor and the name appears in the claim text.
#   claim_type must equal the reader's claim_type for a strict match. A "loose" match ignores the type
#              and feeds the claim-type confusion table.
#   numbers    every listed amount must appear in the claim's value or text (units normalised:
#              "$450 million" == "$450.0 million" == "$450M").
#   keywords   at least one phrase must appear (case-insensitive) in value or text.
#
# Per doc:
#   expected   true claims the reader should extract (they count toward recall)
#   optional   true claims that count as correct if extracted but are not required
#   planted    false claims; extracting one is fine, but it must never reach VERIFIED
#   label      the expected doc-level classifier label

docs:
  nullgrid_product_launch.html:
    injected: false
    label: product_launch
    expected:
      - {id: nullgrid_launch, entity: Nullgrid Security, claim_type: product_launch, value: "Nullgrid XDR 4.0", keywords: ["Nullgrid XDR 4.0", "XDR 4.0", "triage"]}
      - {id: nullgrid_price_standard, entity: Nullgrid Security, claim_type: pricing, value: "$18 per endpoint per month", numbers: ["$18"]}
