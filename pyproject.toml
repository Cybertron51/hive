[project]
name = "hive"
version = "0.1.0"
description = "Open-internet intelligence scraper run by a monitored agent swarm on open-weight models"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "clickhouse-connect>=0.8",
    "feedparser>=6.0",
    "readability-lxml>=0.8",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
